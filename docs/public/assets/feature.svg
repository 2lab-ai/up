<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">인생 레벨업 가이드 책 공유 표지</title>
  <desc id="description">한셴카이 지음, 2lab.ai 옮김. AI 시대 평생학습 가이드. 다섯 단계로 오르는 막대는 입력, 삶, 도구, 실천, 행동을 나타낸다.</desc>
  <rect width="1200" height="630" fill="#f5f7f3"/>
  <rect width="14" height="630" fill="#176f5b"/>
  <path d="M58 94H650M58 570H650" stroke="#cfd7d1" stroke-width="1"/>
  <g fill="none" stroke="#dfe5e0" stroke-width="1">
    <path d="M720 70V570"/>
    <path d="M1190 70V570"/>
    <path d="M720 570H1190"/>
  </g>

  <g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif">
    <text x="70" y="76" fill="#176f5b" font-size="22" font-weight="700">AI 시대 평생학습 가이드</text>
    <text x="70" y="224" fill="#1d2926" font-size="76" font-weight="800">인생 레벨업 가이드</text>
    <text x="72" y="306" fill="#485652" font-size="26">영어라는 문에서 출발해 학습, 삶, AI, 장기적 행동으로</text>
    <text x="72" y="359" fill="#485652" font-size="22">실제 과제로 증거를 남기고, 변화 속에서도 삶의 참여자로 남습니다</text>
    <text x="72" y="446" fill="#1d2926" font-size="20" font-weight="700">문제 발견 → 능동 학습 → AI와 협업 → 실제 과제 완수 → 회고와 전이</text>
    <text x="72" y="535" fill="#1d2926" font-size="24" font-weight="700">한셴카이 지음</text>
    <text x="220" y="535" fill="#6b7773" font-size="20">필명 '리푸'</text>
    <text x="318" y="535" fill="#6b7773" font-size="20">2lab.ai 옮김</text>
    <text x="72" y="605" fill="#6b7773" font-size="17">dosi.dev/up</text>
  </g>

